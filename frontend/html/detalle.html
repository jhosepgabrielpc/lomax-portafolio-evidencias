<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalles | Lomax</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
    <nav class="bg-blue-900 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-widest">LOMAX<span class="text-blue-400">.</span></h1>
            <div class="space-x-6 font-semibold">
                <a href="index.html" class="hover:text-blue-300 transition">Catálogo</a>
                <a href="registro.html" class="hover:text-blue-300 transition">Registrar Producto</a>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-10" id="detalle">
        <p class="text-center text-gray-500 font-bold mt-10 animate-pulse">Cargando información del producto...</p>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        fetch(`/api/productos/${id}`)
            .then(res => res.json())
            .then(p => {
                const container = document.getElementById('detalle');
                if (p.error) {
                    container.innerHTML = `<div class="bg-red-100 text-red-700 p-4 rounded-lg font-bold text-center">${p.error}</div>`;
                    return;
                }
                
                const attrs = Object.entries(p.atributos || {}).map(([k,v]) => `
                    <div class="bg-gray-50 p-3 rounded border border-gray-200">
                        <span class="block text-xs font-bold text-gray-400 uppercase">${k}</span>
                        <span class="block text-gray-800 font-semibold">${v}</span>
                    </div>
                `).join('');

                container.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row">
                        <!-- TRUCO: Fondo azul sólido idéntico al original -->
                        <div class="md:w-1/2 bg-[#0000ff] min-h-[300px] relative">
                            <img src="/api/productos/${p.producto_id}/imagen" alt="${p.nombre}" 
                                 class="w-full h-full object-cover absolute inset-0 transition-opacity duration-300"
                                 onerror="this.style.opacity='0';">
                        </div>
                        <div class="md:w-1/2 p-8 flex flex-col">
                            <span class="text-sm font-bold text-blue-500 tracking-wider uppercase mb-1">${p.codigo}</span>
                            <h2 class="text-3xl font-extrabold text-gray-900 mb-2">${p.nombre}</h2>
                            <div class="flex items-center space-x-4 mb-6">
                                <span class="text-3xl font-black text-gray-900">$${p.precio}</span>
                                <span class="px-3 py-1 text-xs font-bold rounded-full bg-green-100 text-green-800 border border-green-200">${p.estado}</span>
                            </div>
                            <p class="text-gray-600 mb-8 leading-relaxed">${p.descripcion}</p>
                            
                            <h4 class="text-sm font-bold text-gray-900 border-b border-gray-200 pb-2 mb-4">Especificaciones Técnicas</h4>
                            <div class="grid grid-cols-2 gap-4 mb-8">
                                <div class="bg-gray-50 p-3 rounded border border-gray-200">
                                    <span class="block text-xs font-bold text-gray-400 uppercase">ID Sistema</span>
                                    <span class="block text-gray-800 font-semibold text-xs truncate">${p.producto_id}</span>
                                </div>
                                ${attrs}
                            </div>
                            
                            <a href="index.html" class="mt-auto block text-center bg-gray-900 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors">Volver al Catálogo</a>
                        </div>
                    </div>
                `;
            });
    </script>
</body>
</html>
