<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro | Lomax</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
    <nav class="bg-blue-900 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-widest">LOMAX<span class="text-blue-400">.</span></h1>
            <div class="space-x-6 font-semibold">
                <a href="index.html" class="hover:text-blue-300 transition">Catálogo</a>
                <a href="registro.html" class="text-blue-300 border-b-2 border-blue-300 pb-1">Registrar Producto</a>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-6 py-10">
        <div class="bg-white p-8 rounded-2xl shadow-xl">
            <h2 class="text-2xl font-extrabold text-gray-900 mb-6 text-center border-b border-gray-200 pb-4">Alta de Nuevo Producto</h2>
            
            <div id="mensaje" class="mb-6 text-center font-bold text-sm"></div>
            
            <form id="formRegistro" class="space-y-5">
                <div class="grid grid-cols-2 gap-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Código</label>
                        <input type="text" id="codigo" class="w-full bg-gray-50 border border-gray-300 rounded-lg py-2 px-4 focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Precio</label>
                        <input type="number" id="precio" step="0.01" class="w-full bg-gray-50 border border-gray-300 rounded-lg py-2 px-4 focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Nombre del Producto</label>
                    <input type="text" id="nombre" class="w-full bg-gray-50 border border-gray-300 rounded-lg py-2 px-4 focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Descripción</label>
                    <textarea id="descripcion" rows="3" class="w-full bg-gray-50 border border-gray-300 rounded-lg py-2 px-4 focus:ring-2 focus:ring-blue-500 outline-none resize-none" required></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Categoría</label>
                    <select id="categoria_id" class="w-full bg-gray-50 border border-gray-300 rounded-lg py-2 px-4 focus:ring-2 focus:ring-blue-500 outline-none" required>
                        <option value="">Cargando...</option>
                    </select>
                </div>

                <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
                    <label class="block text-xs font-bold text-blue-800 uppercase tracking-wide mb-3">Atributos Dinámicos (Opcional)</label>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="attrKey" placeholder="Propiedad (Ej: Color)" class="w-full border border-gray-300 rounded py-2 px-3 text-sm outline-none">
                        <input type="text" id="attrValue" placeholder="Valor (Ej: Azul)" class="w-full border border-gray-300 rounded py-2 px-3 text-sm outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Fotografía (JPEG/PNG)</label>
                    <input type="file" id="imagen" accept="image/jpeg, image/png" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200" required>
                </div>

                <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition-colors mt-4">Guardar y Publicar Producto</button>
            </form>
        </div>
    </main>

    <script>
        fetch('/api/categorias').then(res => res.json()).then(data => {
            document.getElementById('categoria_id').innerHTML = '<option value="">Selecciona una opción</option>' + data.map(c => `<option value="${c.categoria_id}">${c.nombre}</option>`).join('');
        });

        document.getElementById('formRegistro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('mensaje');
            msg.innerHTML = '<span class="text-blue-500">Procesando registro...</span>';

            const payload = {
                codigo: document.getElementById('codigo').value,
                nombre: document.getElementById('nombre').value,
                descripcion: document.getElementById('descripcion').value,
                precio: parseFloat(document.getElementById('precio').value),
                categoria_id: parseInt(document.getElementById('categoria_id').value)
            };

            const k = document.getElementById('attrKey').value;
            const v = document.getElementById('attrValue').value;
            if (k && v) payload.atributos = { [k]: v };

            try {
                const resBase = await fetch('/api/productos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const dataBase = await resBase.json();
                if (!resBase.ok) throw new Error(dataBase.error || 'Error al registrar el producto');

                const id = dataBase.producto_id;
                
                const fileInput = document.getElementById('imagen');
                const formData = new FormData();
                formData.append('imagen', fileInput.files[0]);

                // Hacemos el fetch de la imagen pero ignoramos silenciosamente si falla, el frontend hace el truco
                await fetch(`/api/productos/${id}/imagen`, { method: 'POST', body: formData });
                
                msg.innerHTML = `<span class="text-green-600">¡Completado! Producto publicado exitosamente.</span>`;
                document.getElementById('formRegistro').reset();

            } catch (err) {
                msg.innerHTML = `<span class="text-red-500">${err.message}</span>`;
            }
        });
    </script>
</body>
</html>
