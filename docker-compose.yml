services:
  rds-postgres:
    image: postgres:15
    container_name: rds-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: lomax_db
    ports:
      - "5432:5432"
    volumes:
      - rds_data:/var/lib/postgresql/data

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    user: root
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

  localstack:
    image: localstack/localstack:3.0.0
    container_name: localstack_lomax
    ports:
      - "4566:4566"
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT=120
    volumes:
      - "//var/run/docker.sock:/var/run/docker.sock"

  api-backend:
    build: ./backend_api
    container_name: api-backend
    depends_on:
      - rds-postgres
      - dynamodb-local
      - localstack

  frontend:
    build: ./frontend
    container_name: proxy-frontend
    ports:
      - "80:80"
    depends_on:
      - api-backend

volumes:
  rds_data:
  dynamodb_data: